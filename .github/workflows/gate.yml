name: gate

# HarUI 门禁 CI — 与 scripts/gate.sh 标准关卡 1-4 对齐
# 触发：push main / tag / PR
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 1.90.0（与 rust-toolchain.toml 一致）
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
          components: clippy, rustfmt

      - name: 编译缓存
        uses: Swatinem/rust-cache@v2

      - name: 安装 iced/winit 系统依赖 + xvfb（无头测试）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev xvfb

      # 关卡 1
      - name: fmt 格式检查
        run: cargo fmt --all -- --check

      # 关卡 2
      - name: check 编译检查
        run: cargo check --workspace --all-targets

      # 关卡 3
      - name: clippy 静态分析（-D warnings）
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 关卡 4（xvfb 下运行，防止 iced 无头环境窗口创建失败）
      - name: test 全量测试
        run: xvfb-run -a cargo test --workspace
