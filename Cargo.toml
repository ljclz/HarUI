[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/components",
    "examples/empty-window",
    "examples/button_demo",
    "examples/input_demo",
    "examples/table_demo",
    "examples/dialog_demo",
    "examples/form_demo",
    "examples/select_demo",
    "examples/pagination_demo",
    "examples/card_demo",
    "examples/tabs_demo",
    "examples/date_picker_demo",
    "examples/cascader_demo",
    "examples/upload_demo",
    "examples/showcase",
    "examples/screenshot_test",
]

[workspace.package]
version = "1.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ljclz/HarUI"
description = "Rust native UI component library, Element Plus equivalent in Rust ecosystem"
keywords = ["ui", "gui", "iced", "components", "element-plus"]
categories = ["gui"]

[workspace.dependencies]
iced = { version = "0.14", features = ["advanced", "svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
proptest = "1"
criterion = "0.5"

# ── 发布构建配置 ──────────────────────────────────────────────────────
#
# 设计决策（ADR-007）：
#   release 默认关闭 LTO，避免 workspace 下 15 个 example 二进制同时触发
#   全量 LTO 导致 LLVM OOM（Windows 常见，内存峰值 >16GB）。
#   发布 crate 到 crates.io 时使用 release-lto 单独构建，
#   仅编译 core + components 两个 rlib，内存可控。
#
# 内存预算：
#   release（lto=false, codegen-units=16）：每 example ~1.5GB 峰值
#   release-lto（lto="fat", codegen-units=1）：每 crate ~3GB 峰值
#
[profile.release]
opt-level = 3
lto = false
codegen-units = 16

# 发布 crate 专用：fat LTO + 单代码单元，仅用于 core/components 库构建
[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.dev]
opt-level = 1
debug = true
