[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/components",
    "examples/empty-window",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/harui/har-ui"
description = "Rust native UI component library, Element Plus equivalent in Rust ecosystem"
keywords = ["ui", "gui", "iced", "components", "element-plus"]
categories = ["gui"]

[workspace.dependencies]
iced = { version = "0.13.1", features = ["advanced"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
proptest = "1"
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
debug = true
