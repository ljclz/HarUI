# cargo-audit 配置 — 已接受风险登记
#
# 原则：仅当漏洞为 iced 生态的传递依赖且无 semver 兼容补丁、
# 且暴露面不构成实际威胁时才允许 ignore。
#
# 2026-09-30 iced 0.14 升级后重审：原 9 条豁免清零 6 条
# （quick-xml ×2 / instant / rustybuzz / ttf-parser 旧档 / lru 旧档 / event-listener），
# 保留下方 3 条（升级后仍由 iced 0.14 传递依赖触发）。升级到更高版本后应再次清零重审。
#
# 暴露面评估基准：HarUI 是本地桌面收银台 UI 库，相关 crate 仅用于
# 内部渲染/宏展开，不解析攻击者可控输入。

[advisories]
version = 2
ignore = [
    # lru 0.16.4 — unsound（panic safety），iced 0.14 传递依赖，字形缓存内部使用，无外部输入路径。
    "RUSTSEC-2026-0253",

    # unmaintained 警告（非漏洞）：iced 0.14 生态残留，等待上游替换。
    "RUSTSEC-2024-0436", # paste
    "RUSTSEC-2026-0192", # ttf-parser
]